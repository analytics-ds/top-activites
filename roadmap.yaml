# -----------------------------------------------------------------------
# VOLET OPEN DATA — PRODUCTION MANUELLE UNIQUEMENT (ne pas passer en auto)
# -----------------------------------------------------------------------
# Ces articles s'appuient sur un pull de donnees publiques (Sirene NAF 56.30Z,
# opendata.paris.fr terrasses-autorisations) que l'agent auto ne sait pas faire.
# A produire en session Claude avec Charlie. Cle distincte : la skill
# /create-article-auto ne lit que `articles`, elle ignore cette liste.
#
# Faisabilite validee le 2026-08-18 :
#   - Sirene via recherche-entreprises.api.gouv.fr : 3677 bars actifs a Paris,
#     43 creations depuis juin 2026, avec enseigne/adresse/date (tri editorial requis)
#   - opendata Paris terrasses-autorisations : 24 220 autorisations avec enseigne,
#     typologie, dimensions, arrondissement

articles_manuels_open_data:
  - kw: "terrasse bar paris"          # + "plus belle terrasse paris" (260) en secondaire
    angle: "Les plus grandes terrasses de bars de Paris, arrondissement par arrondissement (donnees officielles Ville de Paris)"
    source: "opendata.paris.fr terrasses-autorisations"
    category: "Bars et lieux ludiques"
    volume: 390
    priorite: 1
    status: done
    published_date: 2026-08-18
    published_url_fr: "https://top-activites.fr/bars-lieux-ludiques/plus-grandes-terrasses-bars-paris/"
    published_url_en: "https://top-activites.fr/en/bars-lieux-ludiques/biggest-bar-terraces-paris/"

  - kw: "meilleur bar paris"
    angle: "Selection editoriale + data storytelling Sirene (nb de bars par quartier, ouvertures/fermetures)"
    source: "recherche-entreprises.api.gouv.fr NAF 56.30Z"
    category: "Bars et lieux ludiques"
    volume: 880
    priorite: 2

  - kw: "nouveau bar paris"
    angle: "Page evergreen 'les nouveaux bars a Paris' mise a jour chaque mois via le pull Sirene (seed du rendez-vous mensuel actu)"
    source: "recherche-entreprises.api.gouv.fr NAF 56.30Z, creations du mois"
    category: "Bars et lieux ludiques"
    volume: 170
    priorite: 3
